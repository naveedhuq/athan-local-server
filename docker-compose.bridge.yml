# For Docker Desktop (macOS / Windows) or any host where host networking isn't available.
#   PUBLIC_URL=http://192.168.1.20:8080 docker compose -f docker-compose.bridge.yml up -d
#
# Limitations: automatic speaker discovery does not work through the bridge network, so add speakers
# with "Add by IP" on the Speakers page. PUBLIC_URL must be this computer's LAN address, because
# speakers fetch the athan audio from it.
services:
  athan:
    image: ghcr.io/naveedhuq/athan-local-server:latest
    build: .
    container_name: athan
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      TZ: ${TZ:-UTC}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to http://<this computer's LAN IP>:8080}
    volumes:
      - athan-data:/data
volumes:
  athan-data:
