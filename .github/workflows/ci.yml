name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/athan-data
      - run: npm run build
      - name: Package and smoke-test the release bundle
        run: |
          node scripts/make-bundle.mjs --skip-build
          node scripts/smoke-test.mjs

  # Prove the bundle really runs on macOS and Windows (only on the default branch, tags and manual runs).
  cross-platform:
    name: Bundle on ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/make-bundle.mjs
      - run: node scripts/smoke-test.mjs

  deploy:
    name: Deploy to Raspberry Pi
    needs: ci
    # Deploys only from the repository's default branch, never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, athan-pi]
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/update.sh
