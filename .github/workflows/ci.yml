name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/athan-data
      - run: npm run build

  deploy:
    name: Deploy to Raspberry Pi
    needs: ci
    # Only deploys from main (or a manual run), never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, athan-pi]
    steps:
      - uses: actions/checkout@v4
      - run: ./deploy/update.sh
